{% extends "base.html" %}

{% block title %}Inscription - WOL Site{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <h2 class="card-title text-center">📝 Créer un compte</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required autofocus>
                <small>Au moins 3 caractères</small>
            </div>
            
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
                <small>Au moins 6 caractères</small>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn" style="width: 100%;">Créer mon compte</button>
            </div>
        </form>
        
        <p class="text-center" style="margin-top: 1rem;">
            Déjà un compte ? 
            <a href="{{ url_for('login') }}" style="color: var(--primary-color); font-weight: bold;">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
